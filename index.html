<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARTHA — Artha Collective</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#4F46E5',
              'primary-dark': '#4338CA',
              'primary-light': '#818CF8',
              accent: '#F59E0B',
              'accent-dark': '#D97706',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Syne', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out both',
              'fade-up': 'fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) both',
              'scale-in': 'scaleIn 0.4s cubic-bezier(0.16,1,0.3,1) both',
              'float-slow': 'float 8s ease-in-out infinite',
              'shimmer': 'shimmer 3s linear infinite',
              'marquee': 'marquee 40s linear infinite',
              'spin-slow': 'spin 20s linear infinite',
              'pulse-slow': 'pulse 4s ease-in-out infinite',
              'slideLeft': 'slideLeft 0.35s cubic-bezier(0.16,1,0.3,1) both',
            },
            keyframes: {
              fadeIn: { from: { opacity: '0' }, to: { opacity: '1' } },
              fadeUp: { from: { opacity: '0', transform: 'translateY(28px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
              scaleIn: { from: { opacity: '0', transform: 'scale(0.94)' }, to: { opacity: '1', transform: 'scale(1)' } },
              float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-16px)' } },
              shimmer: { '0%': { backgroundPosition: '-200% center' }, '100%': { backgroundPosition: '200% center' } },
              marquee: { from: { transform: 'translateX(0)' }, to: { transform: 'translateX(-50%)' } },
              slideLeft: { from: { transform: 'translateX(100%)' }, to: { transform: 'translateX(0)' } },
            },
            boxShadow: {
              'card': '0 1px 3px rgba(0,0,0,0.04), 0 8px 32px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.04)',
              'card-hover': '0 4px 16px rgba(0,0,0,0.08), 0 24px 48px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.06)',
              'glow-indigo': '0 0 0 1px rgba(79,70,229,0.2), 0 8px 32px rgba(79,70,229,0.25)',
              'glow-amber': '0 0 0 1px rgba(245,158,11,0.2), 0 8px 32px rgba(245,158,11,0.2)',
            },
          },
        },
      };
    </script>
    <style>
      .font-display { font-family: 'Syne', sans-serif; }

      .nav-glass {
        background: rgba(250,250,252,0.88);
        backdrop-filter: blur(24px) saturate(200%);
        -webkit-backdrop-filter: blur(24px) saturate(200%);
        border-bottom: 1px solid rgba(226,229,239,0.7);
      }
      .nav-glass-dark {
        background: rgba(7,8,15,0.82);
        backdrop-filter: blur(24px) saturate(180%);
        border-bottom: 1px solid rgba(37,45,64,0.8);
      }
      .bg-dot-grid {
        background-image: radial-gradient(circle, rgba(255,255,255,0.09) 1px, transparent 1px);
        background-size: 28px 28px;
      }
      .bg-line-grid {
        background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
        background-size: 56px 56px;
      }
      .bg-dot-light {
        background-image: radial-gradient(circle, rgba(0,0,0,0.065) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .text-gradient-primary {
        background: linear-gradient(135deg, #818CF8 0%, #4F46E5 50%, #6366F1 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      }
      .text-gradient-amber {
        background: linear-gradient(135deg, #F59E0B 0%, #FBBF24 60%, #D97706 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      }
      .orb { border-radius: 50%; filter: blur(90px); pointer-events: none; position: absolute; }
      .btn-glow {
        position: relative; overflow: hidden;
        transition: transform 0.2s cubic-bezier(0.16,1,0.3,1), box-shadow 0.2s;
      }
      .btn-glow:hover { transform: translateY(-2px); }
      .btn-glow::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(to bottom, rgba(255,255,255,0.12), transparent);
        pointer-events: none; border-radius: inherit;
      }
      .hover-lift { transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), box-shadow 0.35s cubic-bezier(0.16,1,0.3,1); }
      .hover-lift:hover { transform: translateY(-6px); box-shadow: 0 20px 48px rgba(0,0,0,0.12), 0 8px 16px rgba(0,0,0,0.06); }
      .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1); }
      .reveal.in-view { opacity: 1; transform: translateY(0); }
      .reveal-d1 { transition-delay: 100ms; }
      .reveal-d2 { transition-delay: 200ms; }
      .reveal-d3 { transition-delay: 300ms; }
      .reveal-d4 { transition-delay: 400ms; }
      ::selection { background: rgba(79,70,229,0.15); color: #3730A3; }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: #FAFAFC; }
      ::-webkit-scrollbar-thumb { background: #E2E5EF; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #4F46E5; }
      *:focus-visible { outline: 2px solid #4F46E5; outline-offset: 3px; border-radius: 6px; }

      @keyframes slideLeft {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.10.1",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "@/": "./"
  }
}
</script>
</head>
  <body class="bg-[#FAFAFC] text-[#0F1117] antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
